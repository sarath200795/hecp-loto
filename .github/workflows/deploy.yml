name: Deploy (Vercel)

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Project linkage for the Vercel CLI. VERCEL_TOKEN is read per-step.
env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    name: Build & deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      # A green "Deploy" check must mean an actual deploy. On a push to main
      # (production) we FAIL loudly when credentials are missing instead of
      # skipping silently. On pull requests (preview) we only warn, so a missing
      # token doesn't block merges.
      - name: Check Vercel credentials
        id: creds
        run: |
          if [ -n "${{ secrets.VERCEL_TOKEN }}" ] && [ -n "${{ secrets.VERCEL_ORG_ID }}" ] && [ -n "${{ secrets.VERCEL_PROJECT_ID }}" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            if [ "${{ github.event_name }}" = "push" ]; then
              echo "::error::Production deploy aborted — set the VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID repo secrets (Settings → Secrets and variables → Actions) to enable CD."
              exit 1
            else
              echo "::warning::Vercel secrets not set — skipping preview deploy."
            fi
          fi

      - name: Install Vercel CLI
        if: steps.creds.outputs.ok == 'true'
        run: npm install -g vercel@latest

      # ---- Production (push to main) ----
      - name: Deploy production
        if: steps.creds.outputs.ok == 'true' && github.event_name == 'push'
        run: |
          vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"
          vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"
          url=$(vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}")
          echo "Production: $url" >> "$GITHUB_STEP_SUMMARY"

      # ---- Preview (pull requests) ----
      - name: Deploy preview
        if: steps.creds.outputs.ok == 'true' && github.event_name == 'pull_request'
        run: |
          vercel pull --yes --environment=preview --token="${{ secrets.VERCEL_TOKEN }}"
          vercel build --token="${{ secrets.VERCEL_TOKEN }}"
          url=$(vercel deploy --prebuilt --token="${{ secrets.VERCEL_TOKEN }}")
          echo "Preview: $url" >> "$GITHUB_STEP_SUMMARY"
