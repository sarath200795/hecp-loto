name: Deploy (Vercel)

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Project linkage for the Vercel CLI. VERCEL_TOKEN is read per-step.
env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    name: Build & deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Skip cleanly (green) if the deploy token isn't configured yet.
      - name: Check Vercel token
        id: check
        run: |
          if [ -n "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::VERCEL_TOKEN/ORG/PROJECT not set — skipping deploy. Add repo secrets to enable CD."
          fi

      - name: Install Vercel CLI
        if: steps.check.outputs.ok == 'true'
        run: npm install -g vercel@latest

      # ---- Production (push to main) ----
      - name: Deploy production
        if: steps.check.outputs.ok == 'true' && github.event_name == 'push'
        run: |
          vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"
          vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"
          url=$(vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}")
          echo "Production: $url" >> "$GITHUB_STEP_SUMMARY"

      # ---- Preview (pull requests) ----
      - name: Deploy preview
        if: steps.check.outputs.ok == 'true' && github.event_name == 'pull_request'
        run: |
          vercel pull --yes --environment=preview --token="${{ secrets.VERCEL_TOKEN }}"
          vercel build --token="${{ secrets.VERCEL_TOKEN }}"
          url=$(vercel deploy --prebuilt --token="${{ secrets.VERCEL_TOKEN }}")
          echo "Preview: $url" >> "$GITHUB_STEP_SUMMARY"
